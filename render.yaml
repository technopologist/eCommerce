# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: shopease
    runtime: node
    region: ohio            # same AWS region as the Neon database (us-east-2)
    plan: free              # free sleeps when idle; switch to "starter" before launch
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true        # redeploy on every push to main
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Entered in the Render dashboard on first deploy; never committed.
      - key: DATABASE_URL
        sync: false
